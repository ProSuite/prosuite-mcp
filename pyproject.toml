[project]
name = "prosuite-mcp"
dynamic = ["version"]
description = "MCP server for Dira ProSuite quality verification"
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = "MIT"
authors = [
    { name = "Dira GeoSystems", email = "programmers@dirageosystems.ch" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "prosuite>=1.7.0.0,<2",
    "mcp[cli]>=2.0,<3",
    "pydantic>=2.13,<3",
    "fiona>=1.10.1",
]

[project.optional-dependencies]
local-llm = [
    "openai>=1.0.0",
]

[project.scripts]
prosuite-mcp = "prosuite_mcp.cli:main"

[project.urls]
Homepage = "https://www.dirageosystems.ch"
Repository = "https://github.com/ProSuite/prosuite-mcp"
"Bug Tracker" = "https://github.com/ProSuite/prosuite-mcp/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "pyright==1.1.411",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/prosuite_mcp"]

# Only Python sources belong in the wheel.
exclude = ["**/.claude", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff.lint]
select = ["I"]

