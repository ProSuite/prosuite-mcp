name: Checks

on:
  workflow_call:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: "."

      - name: Install dev dependencies
        run: uv sync --only-group dev --no-install-project

      - name: ruff check
        run: .venv/bin/ruff check . # invoke directly; `uv run` would sync all project deps first

      - name: ruff format check
        run: .venv/bin/ruff format --check .

      - name: mdformat check
        run: .venv/bin/mdformat --check README.md CONTEXT.md docs/*.md

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: "."

      - name: Install all dependencies
        run: uv sync --group dev

      - name: pyright
        run: .venv/bin/pyright

      - name: Run tests
        run: uv run pytest tests/ -v
