name: Checks

on:
  workflow_call:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: "."

      - name: Install dev dependencies
        run: uv sync --only-group dev --no-install-project --locked

      - name: ruff check
        run: .venv/bin/ruff check . # invoke directly; `uv run` would sync all project deps first

      - name: ruff format check
        run: .venv/bin/ruff format --check .

      - name: mdformat check
        run: .venv/bin/mdformat --check README.md CONTEXT.md docs

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: "."

      - name: Install all dependencies
        run: uv sync --group dev --locked

      - name: pyright
        run: .venv/bin/pyright

      - name: Run tests
        run: uv run pytest tests/ -v
